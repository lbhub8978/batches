<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="https://i.ibb.co/XZ528Mxm/Background-Eraser-20260819-094745461.png">
  <title>LB HUB | Key System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Inter', -apple-system, sans-serif;
      background: #f5f6fa;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #1e2139;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(71, 104, 255, 0.10), transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(255, 92, 148, 0.09), transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 3D Hero Icon */
    .hero {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
      perspective: 600px;
    }

    .hero-icon {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: linear-gradient(145deg, #5b7cff, #3d5af1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 20px 40px -8px rgba(61, 90, 241, 0.5),
        0 8px 16px -6px rgba(61, 90, 241, 0.3),
        inset 0 2px 2px rgba(255, 255, 255, 0.4),
        inset 0 -6px 12px rgba(0, 0, 0, 0.15);
      animation: float3d 5s ease-in-out infinite;
      position: relative;
    }

    .hero-icon::after {
      content: '';
      position: absolute;
      top: 12px;
      left: 18px;
      width: 30px;
      height: 26px;
      background: rgba(255,255,255,0.35);
      border-radius: 30px;
      filter: blur(8px);
    }

    .hero-icon svg {
      width: 38px;
      height: 38px;
      color: #fff;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
      position: relative;
      z-index: 1;
    }

    @keyframes float3d {
      0%, 100% { transform: translateY(0) rotateX(0) rotateY(-4deg); }
      25% { transform: translateY(-8px) rotateX(3deg) rotateY(-2deg); }
      50% { transform: translateY(0) rotateX(0) rotateY(4deg); }
      75% { transform: translateY(-5px) rotateX(-3deg) rotateY(0); }
    }

    .title {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #151730;
      margin-bottom: 8px;
    }

    .title .accent {
      background: linear-gradient(135deg, #3d5af1, #7b2ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      font-size: 15px;
      color: #8489a3;
      margin-bottom: 20px;
      font-weight: 500;
    }

    /* Main Card */
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 18px 22px 18px;
      box-shadow:
        0 30px 60px -15px rgba(21, 23, 48, 0.18),
        0 12px 24px -8px rgba(21, 23, 48, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.9);
      position: relative;
    }
    /* 3D Key box */
    .key-box-3d {
      background: linear-gradient(150deg, #f7f8ff, #eef0fb);
      border: 1px solid #e3e6f5;
      border-radius: 18px;
      padding: 14px 16px;
      position: relative;
      box-shadow:
        inset 0 2px 4px rgba(21, 23, 48, 0.05),
        0 2px 8px rgba(21, 23, 48, 0.03);
      margin-bottom: 16px;
    }

    .key-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .key-label {
      font-size: 12px;
      font-weight: 700;
      color: #767b94;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .key-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid #e3e6f5;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 600;
      color: #16a34a;
      box-shadow: 0 2px 6px rgba(21, 23, 48, 0.04);
    }

    .key-chip::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }

    .key-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: #33375c;
      word-break: break-all;
      line-height: 1.8;
      user-select: all;
      -webkit-user-select: all;
      cursor: pointer;
      position: relative;
      padding-right: 90px;
    }

    .copy-hint {
      position: absolute;
      top: 0;
      right: 0;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      color: #a5a9c0;
      letter-spacing: 0.03em;
    }

    /* 3D Button */
    .btn-wrap {
      perspective: 800px;
    }

    .copy-btn {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(165deg, #5b7cff 0%, #3d5af1 45%, #2d3fd8 100%);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
      box-shadow:
        0 12px 24px -6px rgba(61, 90, 241, 0.45),
        0 4px 8px -2px rgba(61, 90, 241, 0.25),
        inset 0 2px 2px rgba(255, 255, 255, 0.35),
        inset 0 -8px 16px rgba(0, 0, 0, 0.12);
      position: relative;
      overflow: hidden;
    }

    .copy-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, rgba(255,255,255,0.25) 0%, transparent 40%);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .copy-btn:hover {
      transform: translateY(-3px) rotateX(2deg);
      box-shadow:
        0 18px 34px -8px rgba(61, 90, 241, 0.55),
        0 6px 12px -2px rgba(61, 90, 241, 0.3),
        inset 0 2px 2px rgba(255, 255, 255, 0.35),
        inset 0 -8px 16px rgba(0, 0, 0, 0.1);
    }

    .copy-btn:hover::before { opacity: 1; }

    .copy-btn:active {
      transform: translateY(0) scale(0.98);
      box-shadow:
        0 6px 14px -4px rgba(61, 90, 241, 0.4),
        inset 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .copy-btn.copied {
      background: linear-gradient(165deg, #34d399 0%, #22c55e 45%, #1a9e4b 100%);
      box-shadow:
        0 12px 24px -6px rgba(34, 197, 94, 0.45),
        0 4px 8px -2px rgba(34, 197, 94, 0.25),
        inset 0 2px 2px rgba(255, 255, 255, 0.35),
        inset 0 -8px 16px rgba(0, 0, 0, 0.1);
    }

    .copy-btn svg,
    .copy-btn span {
      position: relative;
      z-index: 1;
    }

    .copy-btn svg {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
    }

    /* Trust row */
    .trust {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-top: 14px;
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #8a8fa8;
      font-weight: 600;
    }

    .trust-item svg {
      width: 15px;
      height: 15px;
      color: #3d5af1;
    }

    /* Footer */
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: #a5a9c0;
      letter-spacing: 0.02em;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(18px);
      background: #151730;
      color: #fff;
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 9px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 40px rgba(21, 23, 48, 0.25), inset 0 1px 0 rgba(255,255,255,0.1);
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast svg {
      width: 16px;
      height: 16px;
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="hero">
      <div class="hero-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
        </svg>
      </div>
    </div>

    <h1 class="title">LB <span class="accent">HUB</span></h1>
    <p class="subtitle">Your access key is ready to use</p>

    <div class="card">
      <div class="key-box-3d">
        <div class="key-top">
          <span class="key-label">Access Key</span>
          <span class="key-chip">Active</span>
        </div>
        <div class="key-value" id="key-text">
          <span class="copy-hint">tap to copy</span>
          <span id="key-display"></span>
        </div>
      </div>

      <div class="btn-wrap">
        <button class="copy-btn" id="copy-btn" type="button">
          <svg id="copy-icon" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0013.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 01-.75.75H9a.75.75 0 01-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 01-2.25 2.25H6.75A2.25 2.25 0 014.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 011.927-.184" />
          </svg>
          <span id="btn-text">Copy Key</span>
        </button>
      </div>

      <div class="trust">
        <span class="trust-item">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
          </svg>
          Secure
        </span>
        <span class="trust-item">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          Instant
        </span>
      </div>
    </div>

    <p class="footer">LB HUB &mdash; Fast &amp; Secure Access</p>
  </div>

  <div class="toast" id="toast">
    <svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
    </svg>
    <span>Copied to clipboard!</span>
  </div>

  <script>
    const DEFAULT_KEY = "LB HUB AUTH SYSTEM";

    function extractKey() {
      const fullUrl = window.location.href;
      const search = window.location.search;
      const params = new URLSearchParams(search);
      const paramKey = params.get("key") || params.get("key?") || params.get("k");
      if (paramKey && paramKey.trim().length > 0) return paramKey.trim();
      const matchKeyEqual = fullUrl.match(/key\??=([a-zA-Z0-9_-]+)/i);
      if (matchKeyEqual && matchKeyEqual[1]) return matchKeyEqual[1].trim();
      const queryOrHash = fullUrl.substring(fullUrl.indexOf("index.html") + 10);
      const hexMatch = queryOrHash.match(/[a-fA-F0-9]{32,64}/);
      if (hexMatch) return hexMatch[0].trim();
      return DEFAULT_KEY;
    }

    const currentKey = extractKey();
    const keyElement = document.getElementById("key-text");
    const keyDisplay = document.getElementById("key-display");
    const copyButton = document.getElementById("copy-btn");
    const buttonText = document.getElementById("btn-text");
    const copyIcon = document.getElementById("copy-icon");
    const toast = document.getElementById("toast");

    keyDisplay.textContent = currentKey;

    let toastTimer;
    function showToast() {
      clearTimeout(toastTimer);
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    async function copyKey() {
      let success = false;
      if (navigator.clipboard && window.isSecureContext) {
        try { await navigator.clipboard.writeText(currentKey); success = true; } catch (e) { success = false; }
      }
      if (!success) {
        try {
          const temp = document.createElement("textarea");
          temp.value = currentKey;
          temp.style.position = "fixed";
          temp.style.left = "-9999px";
          document.body.appendChild(temp);
          temp.focus();
          temp.select();
          success = document.execCommand("copy");
          document.body.removeChild(temp);
        } catch (err) { success = false; }
      }
      if (success) {
        copyButton.classList.add("copied");
        buttonText.textContent = "Copied!";
        copyIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />';
        showToast();
        setTimeout(() => {
          copyButton.classList.remove("copied");
          buttonText.textContent = "Copy Key";
          copyIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0013.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 01-.75.75H9a.75.75 0 01-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 01-2.25 2.25H6.75A2.25 2.25 0 014.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 011.927-.184" />';
        }, 2000);
      } else {
        window.prompt("Copy Key:", currentKey);
      }
    }

    copyButton.addEventListener("click", copyKey);
    keyElement.addEventListener("click", copyKey);
  </script>
</body>
</html>
