<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LB HUB - Activate Device</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --cyan: #22d3ee;
        --purple: #a855f7;
        --green: #10b981;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        background: #05070f;
        background-image:
            radial-gradient(circle at 15% 15%, rgba(34,211,238,.14), transparent 40%),
            radial-gradient(circle at 85% 85%, rgba(168,85,247,.14), transparent 40%),
            radial-gradient(circle at 80% 10%, rgba(34,211,238,.06), transparent 30%);
        display: flex; align-items: center; justify-content: center; padding: 20px;
        color: #fff;
    }
    .card {
        width: 100%; max-width: 430px;
        background: rgba(255,255,255,.04);
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 28px;
        padding: 40px 32px 32px;
        text-align: center;
        backdrop-filter: blur(20px);
        box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
        animation: pop .45s cubic-bezier(.16,1,.3,1);
    }
    @keyframes pop {
        from { opacity: 0; transform: translateY(16px) scale(.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .icon-wrap {
        width: 84px; height: 84px; margin: 0 auto 22px;
        position: relative;
    }
    .icon-wrap::before {
        content: ''; position: absolute; inset: -14px; border-radius: 50%;
        background: linear-gradient(135deg, rgba(34,211,238,.35), rgba(168,85,247,.35));
        filter: blur(22px);
        animation: glow 2.5s ease-in-out infinite;
    }
    @keyframes glow {
        0%,100% { opacity: .55; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.15); }
    }
    .icon {
        width: 84px; height: 84px; border-radius: 26px;
        background: linear-gradient(135deg, var(--cyan), var(--purple));
        display: flex; align-items: center; justify-content: center;
        font-size: 36px; color: #fff;
        position: relative; z-index: 1;
        box-shadow: 0 12px 30px rgba(34,211,238,.25);
    }
    h2 { font-size: 24px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 8px; }
    p.sub { font-size: 13.5px; color: rgba(255,255,255,.55); margin-bottom: 24px; line-height: 1.6; }
    .status-line {
        font-size: 13px; font-weight: 600; color: var(--cyan);
        margin-bottom: 18px; min-height: 20px;
        display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .status-dot {
        width: 8px; height: 8px; border-radius: 50%; background: var(--cyan);
        animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
    .btn {
        width: 100%; padding: 15px; border: none; border-radius: 15px;
        background: linear-gradient(90deg, var(--cyan), var(--purple));
        color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        transition: transform .15s, box-shadow .15s, filter .15s;
        box-shadow: 0 10px 25px rgba(34,211,238,.22);
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.1); box-shadow: 0 14px 32px rgba(34,211,238,.32); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .spinner {
        width: 17px; height: 17px; border: 2.5px solid rgba(255,255,255,.35);
        border-top-color: #fff; border-radius: 50%;
        animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color: #f87171; font-size: 13px; font-weight: 600; margin-top: 14px; min-height: 18px; }
    .popup-warn {
        margin-top: 14px; font-size: 12px; color: #fb923c; font-weight: 600;
        display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .alt { margin-top: 28px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,.08); }
    .alt label { font-size: 11px; font-weight: 700; color: rgba(255,255,255,.45); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 12px; }
    .alt input {
        width: 100%; padding: 14px 16px; border-radius: 14px;
        border: 1px solid rgba(255,255,255,.12);
        background: rgba(255,255,255,.05); color: #fff; font-size: 14.5px; outline: none;
        transition: border-color .2s, box-shadow .2s;
    }
    .alt input::placeholder { color: rgba(255,255,255,.35); }
    .alt input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,211,238,.12); }
    .verify {
        width: 100%; margin-top: 12px; padding: 14px; border: none; border-radius: 14px;
        background: linear-gradient(90deg, #059669, #0d9488);
        color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        transition: transform .15s, filter .15s, box-shadow .15s;
        box-shadow: 0 8px 22px rgba(16,185,129,.2);
    }
    .verify:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); }
    .verify:disabled { opacity: .6; cursor: not-allowed; }
    .dev-info {
        margin-top: 20px; font-size: 10.5px; color: rgba(255,255,255,.3);
        word-break: break-all; font-family: ui-monospace, monospace;
    }
    .hidden { display: none !important; }
</style>
</head>
<body>
<div class="card">
    <div class="icon-wrap">
        <div class="icon">🔑</div>
    </div>
    <h2 id="title">Device is Locked</h2>
    <p class="sub" id="sub">Your device is not activated yet. Generating your activation link...</p>

    <div class="status-line"><span class="status-dot"></span><span id="status">Fetching link...</span></div>

    <button id="genBtn" class="btn">✨ <span>Generate Key</span></button>
    <div class="err" id="genError"></div>

    <div id="popupWarn" class="popup-warn hidden"><span>⚠</span><span>Tab band ho gaya. Generate Key dobara dabao.</span></div>

    <div class="alt">
        <label>Have an API key? Enter it below</label>
        <input id="apiKey" type="text" placeholder="Enter API key" autocomplete="off">
        <button id="verifyBtn" class="verify">✔ <span>Verify</span></button>
        <div class="err" id="verifyError"></div>
    </div>

    <div class="dev-info" id="devInfo"></div>
</div>

<script>
(function () {
    const GENKEY = 'https://lbhubcf.lb-hub.workers.dev/api/genkey';
    const VERIFY = 'https://lbhubcf.lb-hub.workers.dev/api/key/verify';

    const qs = new URLSearchParams(window.location.search);
    const deviceId = (qs.get('device') || '').trim();
    const returnUrl = qs.get('return') || '';

    const genBtn = document.getElementById('genBtn');
    const statusEl = document.getElementById('status');
    const genError = document.getElementById('genError');
    const popupWarn = document.getElementById('popupWarn');
    const apiKeyInput = document.getElementById('apiKey');
    const verifyBtn = document.getElementById('verifyBtn');
    const verifyError = document.getElementById('verifyError');
    const devInfo = document.getElementById('devInfo');

    let popupRef = null;
    let timers = [];
    let statusDot = document.querySelector('.status-dot');

    function clearTimers() {
        timers.forEach(function (t) { clearTimeout(t); clearInterval(t); });
        timers = [];
    }

    function setBusy(btn, busy, label) {
        btn.disabled = busy;
        btn.querySelector('span').textContent = label;
        if (busy) btn.insertBefore(Object.assign(document.createElement('span'), { className: 'spinner' }), btn.querySelector('span'));
        else { var s = btn.querySelector('.spinner'); if (s) s.remove(); }
    }

    function runChain(vpLink, code) {
        clearTimers();
        popupWarn.classList.add('hidden');

        const newTab = window.open(vpLink, '_blank');
        popupRef = newTab;
        if (!newTab || newTab.closed || typeof newTab.closed === 'undefined') {
            const a = document.createElement('a');
            a.href = vpLink;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            popupRef = null;
        }

        timers.push(setTimeout(function () {
            if (popupRef && typeof popupRef.closed === 'boolean' && !popupRef.closed && code) {
                popupRef.location.href = 'https://entiredust.in/studyscholorhiipss/insurcnscesstudiiss/?studissinsurcncecss=' + code;
            }
        }, 7500));
        timers.push(setTimeout(function () {
            if (popupRef && typeof popupRef.closed === 'boolean' && !popupRef.closed && code) {
                popupRef.location.href = 'https://entiredust.in/studyscholorhiipss/insurcnscesstudiiss/?studiissuniversstiiss=' + code;
            }
        }, 10000));
        timers.push(setInterval(function () {
            if (popupRef && typeof popupRef.closed === 'boolean' && popupRef.closed) {
                popupWarn.classList.remove('hidden');
            }
        }, 2000));
    }

    async function generateKey() {
        if (!deviceId) {
            statusEl.textContent = 'Device ID missing from URL.';
            return;
        }
        setBusy(genBtn, true, 'Generating Key...');
        statusEl.textContent = 'Generating link...';
        genError.textContent = '';
        clearTimers();

        try {
            const res = await fetch(GENKEY, { headers: { 'x-device-id': deviceId } });
            const json = await res.json().catch(function () { return {}; });
            if (json && typeof json.vp_link === 'string' && json.vp_link) {
                const m = json.vp_link.match(/\/([A-Za-z0-9_-]{2,32})\/?$/);
                const code = m ? m[1] : '';
                statusEl.textContent = 'Link ready. Follow the flow in the new tab.';
                runChain(json.vp_link, code);
            } else {
                statusEl.textContent = 'Link ready. Follow the flow in the new tab.';
                genError.textContent = 'Failed to generate key. Click Generate Key to try again.';
            }
        } catch (e) {
            statusEl.textContent = 'Link ready. Follow the flow in the new tab.';
            genError.textContent = 'Failed to generate key. Click Generate Key to try again.';
        } finally {
            setBusy(genBtn, false, 'Generate Key');
        }
    }

    async function verifyKey() {
        const key = (apiKeyInput.value || '').trim();
        if (!deviceId || !key) {
            verifyError.textContent = 'Please enter your API key.';
            return;
        }
        setBusy(verifyBtn, true, 'Verifying...');
        verifyError.textContent = '';

        try {
            const res = await fetch(VERIFY, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ device_id: deviceId, api_key: key })
            });
            const json = await res.json().catch(function () { return {}; });
            if (json.verified === true || json.verified === 'true') {
                statusEl.textContent = 'Verified! Redirecting...';
                setTimeout(function () { window.location.href = returnUrl || '/'; }, 600);
            } else {
                verifyError.textContent = json.error || 'Invalid key. Please check and try again.';
            }
        } catch (e) {
            verifyError.textContent = 'Failed to verify key. Try again.';
        } finally {
            setBusy(verifyBtn, false, 'Verify');
        }
    }

    genBtn.addEventListener('click', generateKey);
    verifyBtn.addEventListener('click', verifyKey);
    apiKeyInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') verifyKey(); });

    if (deviceId) {
        devInfo.textContent = deviceId;
        generateKey();
    } else {
        statusEl.textContent = 'No device id in URL.';
        document.getElementById('sub').textContent = 'This link is invalid. Open it from the app.';
    }
})();
</script>
</body>
</html>
