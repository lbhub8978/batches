<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activate Your Device | LB HUB</title>
<meta name="description" content="Securely generate or verify your LB HUB activation key.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ design tokens ============ */
:root {
    --radius: 0.5rem;
    --background: oklch(0.135 0.018 255);
    --foreground: oklch(0.96 0.01 220);
    --card: oklch(0.18 0.022 255 / 92%);
    --card-foreground: oklch(0.96 0.01 220);
    --primary: oklch(0.78 0.15 196);
    --primary-hover: oklch(0.84 0.14 191);
    --primary-foreground: oklch(0.15 0.03 215);
    --primary-soft: oklch(0.78 0.15 196 / 10%);
    --primary-soft-foreground: oklch(0.88 0.09 196);
    --muted-foreground: oklch(0.69 0.025 240);
    --border: oklch(0.32 0.025 250 / 60%);
    --border-strong: oklch(0.43 0.035 235 / 65%);
    --input: oklch(0.4 0.03 245 / 70%);
    --input-surface: oklch(0.145 0.016 255);
    --ring: oklch(0.78 0.15 196);
    --surface: oklch(0.205 0.022 255 / 75%);
    --video: oklch(0.07 0.01 255);
    --success: oklch(0.68 0.16 160);
    --success-hover: oklch(0.74 0.16 158);
    --success-foreground: oklch(0.98 0.01 160);
    --warning: oklch(0.77 0.15 70);
    --destructive: oklch(0.7 0.19 24);
    --shadow-panel: 0 28px 70px oklch(0.04 0.015 255 / 45%);
    --shadow-action: 0 10px 24px oklch(0.68 0.14 196 / 16%);
    --shadow-action-hover: 0 14px 32px oklch(0.68 0.14 196 / 25%);
    --font-sans: "Manrope", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}

/* ============ reset ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-color:var(--border)}
body{background-color:var(--background);color:var(--foreground);font-family:var(--font-sans);letter-spacing:0;overflow-x:hidden}
button,input{font:inherit}
a{text-decoration:none;color:inherit}

/* ============ activation shell ============ */
.activation-shell{
    min-height:100vh;
    background-image:
        linear-gradient(var(--border) 1px,transparent 1px),
        linear-gradient(90deg,var(--border) 1px,transparent 1px),
        linear-gradient(135deg,var(--background),oklch(0.16 0.025 235));
    background-position:center;
    background-size:64px 64px,64px 64px,100% 100%;
}

/* ============ status pulse ============ */
.status-pulse{animation:activation-status-pulse 1.8s ease-in-out infinite}
@keyframes activation-status-pulse{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

/* ============ video frame ============ */
.activation-video-frame{aspect-ratio:9/16;width:min(100%,17rem);margin-inline:auto;border-radius:0 0 calc(var(--radius)+8px) calc(var(--radius)+8px);overflow:hidden;background:var(--video)}
.activation-video-frame iframe{width:100%;height:100%;border:0;display:block}

/* ============ layout (from index.tsx) ============ */
.shell-inner{
    max-width:80rem;margin:0 auto;
    min-height:100vh;display:flex;flex-direction:column;
    padding:16px;
}
@media(min-width:640px){.shell-inner{padding:24px}}
@media(min-width:1024px){.shell-inner{padding:32px}}
@media(max-width:380px){.shell-inner{padding:12px}.activation-card{padding:16px}}

/* header */
.shell-header{
    display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;
    border-bottom:1px solid var(--border);padding-bottom:16px;
}
@media(min-width:640px){.shell-header{padding-bottom:20px}}
.shell-logo{display:flex;align-items:center;gap:12px;min-width:0}
.shell-logo-icon{
    width:40px;height:40px;display:grid;place-items:center;
    border-radius:calc(var(--radius) - 2px);
    background:var(--primary);color:var(--primary-foreground);
    box-shadow:var(--shadow-action);flex-shrink:0;
}
.shell-logo-icon svg{width:20px;height:20px}
.shell-logo-text p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shell-logo-text .brand{font-size:14px;font-weight:700;letter-spacing:.03em}
.shell-logo-text .sub{font-size:12px;color:var(--muted-foreground)}
.shell-status{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--success);flex-shrink:0}
.shell-status .status-pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--success)}
.shell-status-text{display:none}
@media(min-width:640px){.shell-status-text{display:inline}}

/* main: single centered card */
.shell-main{display:flex;flex:1;align-items:center;justify-content:center;gap:24px;padding:24px 0}

/* how to generate card */
.howto-card{
    display:flex;align-items:center;gap:12px;
    margin-top:16px;border-radius:calc(var(--radius) - 2px);
    border:1px solid var(--border);background:var(--surface);
    padding:12px 14px;font-size:14px;color:var(--muted-foreground);
    text-decoration:none;transition:border-color .2s,color .2s;
}
.howto-card:hover{color:var(--foreground);border-color:var(--ring)}
.howto-card .howto-ico{
    width:32px;height:32px;display:grid;place-items:center;flex-shrink:0;
    border-radius:50%;background:var(--primary);color:var(--primary-foreground);
}
.howto-card .howto-ico svg{width:14px;height:14px;margin-left:1px;fill:currentColor;stroke:none}
.howto-card .howto-text{min-width:0}
.howto-card .howto-text .t{font-weight:600;color:var(--primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.howto-card .howto-text .s{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.howto-card .howto-arrow{margin-left:auto;flex-shrink:0;color:var(--muted-foreground)}
.howto-card .howto-arrow svg{width:14px;height:14px}

.activation-card{
    max-width:28rem;width:100%;margin:0 auto;
    border-radius:calc(var(--radius) - 2px);
    border:1px solid var(--border-strong);background:var(--card);
    padding:20px;box-shadow:var(--shadow-panel);
}
@media(min-width:640px){.activation-card{padding:28px}}

.card-header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:16px;margin-bottom:24px}
.card-header-text .label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--muted-foreground)}
.card-header-text h2{margin-top:8px;font-size:24px;font-weight:700}
.card-icon{
    width:44px;height:44px;display:grid;place-items:center;flex-shrink:0;
    border-radius:calc(var(--radius) - 2px);
    border:1px solid var(--border);background:var(--surface);color:var(--primary);
}
.card-icon svg{width:20px;height:20px}

/* device id box */
.device-box{margin-bottom:20px;border-radius:calc(var(--radius) - 2px);border:1px solid var(--border);background:var(--surface);padding:14px}
.device-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.device-row .lbl{font-size:12px;color:var(--muted-foreground)}
.device-row .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.device-row .status.ok{color:var(--success)}
.device-row .status.warn{color:var(--warning)}
.device-row .status svg{width:14px;height:14px}
.device-id{margin-top:8px;font-family:var(--font-mono);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* buttons */
.btn{
    width:100%;display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:10px;
    padding:14px 16px;border:none;border-radius:calc(var(--radius) - 2px);
    font-weight:700;font-size:15px;cursor:pointer;
    transition:transform .15s,filter .15s,box-shadow .15s;
}
.btn .btn-ico{width:20px;height:20px;flex-shrink:0}
.btn .arrow{margin-left:auto;width:16px;height:16px;flex-shrink:0}
.btn .btn-lbl{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn .spinner-sm{margin-left:0}
.btn-primary{background:var(--primary);color:var(--primary-foreground);box-shadow:var(--shadow-action)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.1);box-shadow:var(--shadow-action-hover)}
.btn-primary:active:not(:disabled){transform:translateY(0)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-success{background:var(--success);color:var(--success-foreground)}
.btn-success:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08);background:var(--success-hover)}
.btn-success:disabled{opacity:.6;cursor:not-allowed}
.spinner-sm{width:18px;height:18px;border:2.5px solid oklch(.15 .03 215 / .35);border-top-color:var(--primary-foreground);border-radius:50%;animation:act-spin .7s linear infinite;flex-shrink:0}
@keyframes act-spin{to{transform:rotate(360deg)}}

/* status banner */
.status-banner{
    display:flex;align-items:start;gap:10px;
    margin-top:16px;border-radius:calc(var(--radius) - 2px);
    border:1px solid oklch(.78 .15 196 / .3);background:var(--primary-soft);
    padding:12px 14px;font-size:14px;color:var(--primary-soft-foreground);
}
.status-banner .dot{margin-top:4px;width:8px;height:8px;border-radius:50%;background:var(--primary);flex-shrink:0}
.err-msg{margin-top:12px;font-size:14px;font-weight:500;color:var(--destructive)}
.warn-msg{margin-top:12px;font-size:14px;font-weight:500;color:var(--warning);display:flex;align-items:center;gap:8px}
.warn-msg svg{width:16px;height:16px;flex-shrink:0}

/* divider */
.divider{display:flex;align-items:center;gap:12px;margin:24px 0}
.divider .line{flex:1;height:1px;background:var(--border)}
.divider .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--muted-foreground)}

/* key input */
.key-label{font-size:14px;font-weight:600}
.key-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;margin-top:8px}
.key-input{
    min-width:0;padding:14px;border-radius:calc(var(--radius) - 2px);
    border:1px solid var(--input);background:var(--input-surface);
    color:var(--foreground);font-size:14px;outline:0;
    transition:box-shadow .2s,border-color .2s;
}
.key-input::placeholder{color:var(--muted-foreground)}
.key-input:focus{border-color:var(--ring);box-shadow:0 0 0 2px oklch(.78 .15 196 / .2)}
.btn-icon{padding:12px 14px}
.btn-icon svg{width:16px;height:16px}
.btn-icon span{display:none}
@media(min-width:640px){.btn-icon span{display:inline}}
.btn-ghost{background:transparent;color:var(--muted-foreground);border:1px solid var(--input)}
.btn-ghost:hover:not(:disabled){color:var(--foreground);border-color:var(--ring)}
.btn-ghost:disabled{opacity:.5;cursor:not-allowed}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* footer inside card */
.card-footer{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:24px;padding-top:20px;border-top:1px solid var(--border);
    font-size:12px;color:var(--muted-foreground);
}
.card-footer svg{width:16px;height:16px;color:var(--success)}

/* shell footer */
.shell-footer{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;border-top:1px solid var(--border);padding-top:16px;
    font-size:12px;color:var(--muted-foreground);
}

.hidden{display:none !important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;scroll-behavior:auto !important}}
@media(max-width:639px){.activation-video-frame{width:min(100%,15rem)}}
</style>
</head>
<body>
<main class="activation-shell">
<div class="shell-inner">

    <!-- HEADER -->
    <header class="shell-header">
        <div class="shell-logo">
            <div class="shell-logo-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M12 2a4 4 0 0 0-4 4c0 2 1 3 2 4l2 2 2-2c1-1 2-2 2-4a4 4 0 0 0-4-4z"/><path d="M12 18v4"/></svg></div>
            <div class="shell-logo-text">
                <p class="brand">LB HUB</p>
                <p class="sub">Secure activation</p>
            </div>
        </div>
        <div class="shell-status">
            <span class="status-pulse status-pulse-dot"></span>
            <span class="shell-status-text">Systems online</span>
        </div>
    </header>

    <!-- MAIN -->
    <section class="shell-main">
        <div class="activation-card">
            <div class="card-header">
                <div class="card-header-text">
                    <p class="label">Activation console</p>
                    <h2>Device is locked</h2>
                </div>
                <div class="card-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
            </div>

            <div class="device-box">
                <div class="device-row">
                    <span class="lbl">Device ID</span>
                    <span id="deviceStatus" class="status warn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg> Missing</span>
                </div>
                <p id="deviceLabel" class="device-id">No device connected</p>
            </div>

            <button id="genBtn" class="btn btn-primary" disabled>
                <svg class="btn-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                <span id="genLabel" class="btn-lbl">Generate activation key</span>
                <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>

            <div id="statusBox" class="status-banner hidden" role="status">
                <span class="dot status-pulse"></span>
                <span id="statusText"></span>
            </div>
            <p id="genError" class="err-msg hidden" role="alert"></p>
            <p id="popupWarn" class="warn-msg hidden" role="alert">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                The new tab closed. Generate the key again.
            </p>

            <div class="divider"><span class="line"></span><span class="lbl">or use a key</span><span class="line"></span></div>

            <label for="apiKey" class="key-label">API key</label>
            <div class="key-row">
                <input id="apiKey" type="text" placeholder="Enter your key" autocomplete="off" class="key-input">
                <button id="pasteBtn" class="btn btn-ghost btn-icon" title="Paste from clipboard">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
                    <span class="sr-only">Paste</span>
                </button>
                <button id="verifyBtn" class="btn btn-success btn-icon" disabled aria-label="Verify API key">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    <span>Verify</span>
                </button>
            </div>
            <p id="verifyError" class="err-msg hidden" role="alert"></p>

            <a class="howto-card" href="https://youtu.be/rnmsdLdQnW4" target="_blank" rel="noopener">
                <span class="howto-ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg></span>
                <span class="howto-text">
                    <span class="t">Watch &ldquo;How to generate a key&rdquo;</span>
                    <span class="s">YouTube &middot; 1 min</span>
                </span>
                <span class="howto-arrow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg></span>
            </a>

            <div class="card-footer">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
                Encrypted and bound to this device
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="shell-footer">
        <span>&copy; 2026 LB HUB</span>
        <span>Protected activation</span>
    </footer>

</div>
</main>

<script>
(function () {
    var GENKEY = 'https://lbhubackend.vercel.app/api/genkey';
    var VERIFY = 'https://lbhubackend.vercel.app/api/key/verify';

    var qs = new URLSearchParams(window.location.search);
    var deviceId = (qs.get('device') || '').trim();
    var returnUrl = qs.get('return') || '';

    var genBtn = document.getElementById('genBtn');
    var genLabel = document.getElementById('genLabel');
    var statusBox = document.getElementById('statusBox');
    var statusText = document.getElementById('statusText');
    var genError = document.getElementById('genError');
    var popupWarn = document.getElementById('popupWarn');
    var deviceLabel = document.getElementById('deviceLabel');
    var deviceStatus = document.getElementById('deviceStatus');
    var apiKeyInput = document.getElementById('apiKey');
    var verifyBtn = document.getElementById('verifyBtn');
    var pasteBtn = document.getElementById('pasteBtn');
    var verifyError = document.getElementById('verifyError');

    var popupRef = null;
    var timers = [];

    function clearTimers() { timers.forEach(function(t){clearTimeout(t);clearInterval(t)}); timers = []; }

    function setBusy(btn, busy, label, showSpinner) {
        btn.disabled = busy;
        var existing = btn.querySelector('.spinner-sm');
        if (busy) {
            if (!existing) {
                var sp = document.createElement('span');
                sp.className = 'spinner-sm';
                btn.insertBefore(sp, btn.firstChild);
            }
            if (label) {
                var lbl = btn.querySelector('#genLabel') || btn.querySelector('span');
                if (lbl) lbl.textContent = label;
            }
        } else {
            if (existing) existing.remove();
            if (label) {
                var lbl2 = btn.querySelector('#genLabel') || btn.querySelector('span');
                if (lbl2) lbl2.textContent = label;
            }
        }
    }

    function showStatus(text) { statusBox.classList.remove('hidden'); statusText.textContent = text; }
    function hideStatus() { statusBox.classList.add('hidden'); }
    function showError(el, text) { el.classList.remove('hidden'); el.textContent = text; }
    function hideError(el) { el.classList.add('hidden'); }

    function runChain(vpLink, code) {
        clearTimers();
        popupWarn.classList.add('hidden');
        var popup = window.open(vpLink, '_blank');
        if (popup) {
            popupRef = popup;
        } else {
            var a = document.createElement('a');
            a.href = vpLink; a.target = '_blank'; a.rel = 'noopener noreferrer';
            document.body.appendChild(a); a.click(); a.remove();
            popupRef = null;
        }
        timers.push(setTimeout(function(){
            if (popupRef && typeof popupRef.closed === 'boolean' && !popupRef.closed && code)
                popupRef.location.href = 'https://entiredust.in/studyscholorhiipss/insurcnscesstudiiss/?studissinsurcncecss=' + code;
        }, 7500));
        timers.push(setTimeout(function(){
            if (popupRef && typeof popupRef.closed === 'boolean' && !popupRef.closed && code)
                popupRef.location.href = 'https://entiredust.in/studyscholorhiipss/insurcnscesstudiiss/?studiissuniversstiiss=' + code;
        }, 10000));
        timers.push(setTimeout(function(){
            if (popupRef && typeof popupRef.closed === 'boolean' && popupRef.closed) popupWarn.classList.remove('hidden');
        }, 12000));
    }

    function generateKey() {
        if (!deviceId) { showStatus('Device ID is missing. Open this page from the LB HUB app.'); return; }
        setBusy(genBtn, true, 'Generating key\u2026');
        showStatus('Preparing your secure activation link\u2026');
        hideError(genError); clearTimers();
        fetch(GENKEY, { headers: { 'x-device-id': deviceId } })
            .then(function(r){ return r.json().catch(function(){return {}}); })
            .then(function(j){
                if (!j || typeof j.vp_link !== 'string' || !j.vp_link) throw 0;
                var m = j.vp_link.match(/\/([A-Za-z0-9_-]{2,32})\/?$/);
                showStatus('Link ready. Complete the steps in the new tab.');
                runChain(j.vp_link, m ? m[1] : '');
            })
            .catch(function(){ hideStatus(); showError(genError, "We couldn't create a key. Please try again."); })
            .finally(function(){ setBusy(genBtn, false, 'Generate activation key'); genBtn.disabled = false; });
    }

    function verifyKey() {
        var key = (apiKeyInput.value || '').trim();
        if (!key) { showError(verifyError, 'Enter a valid API key to continue.'); return; }
        setBusy(verifyBtn, true);
        hideError(verifyError);
        var body = { api_key: key };
        if (deviceId) body.device_id = deviceId;
        fetch(VERIFY, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
            .then(function(r){ return r.json().catch(function(){return {}}); })
            .then(function(j){
                if (j.verified === true || j.verified === 'true') {
                    showStatus('Verified. Taking you back to LB HUB\u2026');
                    var dest = j.url || j.redirect_url || j.redirect || j.link || returnUrl || '/';
                    setTimeout(function(){ window.location.href = dest; }, 600);
                } else {
                    showError(verifyError, j.error || "That key isn't valid. Check it and try again.");
                }
            })
            .catch(function(){ showError(verifyError, 'Verification failed. Check your connection and try again.'); })
            .finally(function(){ setBusy(verifyBtn, false); verifyBtn.disabled = false; syncVerifyBtn(); });
    }

    // init
    if (deviceId) {
        deviceLabel.textContent = deviceId.length > 18 ? deviceId.slice(0,9) + '\u2026' + deviceId.slice(-6) : deviceId;
        deviceStatus.className = 'status ok';
        deviceStatus.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg> Detected';
        genBtn.disabled = false;
        verifyBtn.disabled = false;
    }

    function syncVerifyBtn() {
        verifyBtn.disabled = !((apiKeyInput.value || '').trim());
    }

    genBtn.addEventListener('click', generateKey);
    verifyBtn.addEventListener('click', verifyKey);
    apiKeyInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') verifyKey(); });
    apiKeyInput.addEventListener('input', syncVerifyBtn);
    pasteBtn.addEventListener('click', function(){
        navigateClipboard(function(txt){
            if (txt) { apiKeyInput.value = txt.trim(); syncVerifyBtn(); verifyBtn.focus(); }
        });
    });

    function navigateClipboard(cb) {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.readText().then(cb).catch(function(){});
        } else {
            apiKeyInput.focus();
            document.execCommand('paste');
        }
    }
})();
</script>
</body>
</html>
